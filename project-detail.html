<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png" href="logohq.png">
    <link rel="apple-touch-icon" href="appletouchicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-tr="Proje Detay - CEE Mimarlık" data-en="Project Detail - CEE Architecture" data-de="Projektdetail - CEE" data-ru="Детали проекта - CEE" data-ar="تفاصيل المشروع - CEE" data-fa="جزئیات پروژه - CEE" data-es="Detalle del Proyecto - CEE">Proje Detay - CEE Mimarlık</title>
    <meta name="description" content="CEE Mimarlık projesi detayları">
    <meta property="og:title" content="CEE Mimarlık - Proje Detayı">
    <meta property="og:description" content="CEE Mimarlık projelerini inceleyin.">
    <meta property="og:image" content="https://www.ceemimarlik.com/ogimage.jpg">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://www.ceemimarlik.com/project-detail.html">
    <link rel="stylesheet" href="cross-browser-fix.css">
    <style>
        :root {
            --primary: #2c2c2c; --secondary: #666; --accent: #1a1a1a;
            --bg: #fafafa; --bg-card: #ffffff; --border: #e8e8e8;
            --text: #2c2c2c; --text-light: #888;
            --metallic: linear-gradient(180deg, #808080, #505050, #2a2a2a, #1a1a1a);
            --metallic-light: linear-gradient(180deg, #999, #777, #555);
        }
        body.dark-mode {
            --bg: #0f0f0f; --bg-card: #1a1a1a; --border: #333;
            --text: #e8e8e8; --text-light: #888;
            --metallic: linear-gradient(180deg, #ccc, #aaa, #888, #666);
            --metallic-light: linear-gradient(180deg, #bbb, #999, #777);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }

        /* HEADER */
        .site-header {
            position: fixed; top: 0; width: 100%; z-index: 1000;
            background: rgba(255,255,255,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border); transition: all 0.4s;
        }
        body.dark-mode .site-header { background: rgba(15,15,15,0.97); }
        .header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-area img { height: 70px; width: auto; }
        .logo-text { font-size: 7px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--text-light); margin-top: 4px; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .btn-back {
            font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary);
            text-decoration: none; padding: 8px 20px; border: 1px solid var(--border); border-radius: 6px; transition: all 0.3s;
        }
        .btn-back:hover { background: var(--primary); color: white; }
        body.dark-mode .btn-back { color: #ccc; border-color: #555; }
        body.dark-mode .btn-back:hover { background: #ccc; color: #111; }
        .theme-toggle { background: none; border: none; font-size: 20px; cursor: pointer; padding: 6px; }

        /* MAIN */
        main { margin-top: 120px; padding: 0 20px 80px; max-width: 1000px; margin-left: auto; margin-right: auto; }

        /* HERO IMAGE */
        .project-hero { width: 100%; height: 450px; border-radius: 16px; overflow: hidden; margin-bottom: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        .project-hero img { width: 100%; height: 100%; object-fit: cover; }

        /* GALLERY */
        .project-gallery { display: flex; gap: 10px; margin-bottom: 40px; overflow-x: auto; padding-bottom: 10px; }
        .project-gallery img { width: 150px; height: 100px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: all 0.3s; flex-shrink: 0; }
        .project-gallery img:hover, .project-gallery img.active { border-color: var(--primary); opacity: 0.9; }

        /* INFO CARD */
        .project-info { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 50px; margin-bottom: 40px; }
        .project-title {
            font-size: clamp(24px, 4vw, 36px); font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
            background: var(--metallic); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 20px;
        }
        .section-decoration { display: flex; align-items: center; gap: 15px; margin: 15px 0 25px; }
        .section-decoration::before, .section-decoration::after { content: ''; width: 30px; height: 1px; background: var(--border); }
        .section-decoration .dot { width: 5px; height: 5px; background: var(--metallic-light); transform: rotate(45deg); }

        .project-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .project-tag {
            font-size: 10px; letter-spacing: 2px; color: var(--secondary); border: 1px solid var(--border);
            padding: 6px 16px; text-transform: uppercase; border-radius: 4px;
        }
        .project-meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .meta-item { padding: 12px; background: var(--bg); border-radius: 10px; text-align: center; }
        .meta-item .meta-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-light); margin-bottom: 4px; }
        .meta-item .meta-value { font-size: 14px; font-weight: 500; color: var(--text); }
        .project-description { font-size: 15px; line-height: 2; color: var(--secondary); }

        /* CTA */
        .project-cta {
            background: var(--metallic); padding: 50px; border-radius: 16px; text-align: center;
        }
        .cta-title { font-size: 24px; font-weight: 300; color: white; margin-bottom: 15px; letter-spacing: 3px; }
        .cta-text { color: rgba(255,255,255,0.7); margin-bottom: 25px; font-size: 14px; }
        .cta-btn {
            display: inline-block; padding: 14px 35px; background: white; color: var(--primary);
            text-decoration: none; font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
            border-radius: 6px; transition: all 0.3s;
        }
        .cta-btn:hover { background: #f0f0f0; transform: translateY(-2px); }

        /* LOADING */
        .loading { text-align: center; padding: 80px 20px; }
        .loading-spinner { width: 35px; height: 35px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .not-found { text-align: center; padding: 80px 20px; }
        .not-found h2 { font-size: 28px; font-weight: 300; margin-bottom: 15px; background: var(--metallic); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* FOOTER */
        .site-footer { text-align: center; padding: 30px 20px; border-top: 1px solid var(--border); }
        .site-footer p { font-size: 12px; color: var(--text-light); }
        .site-footer a { color: var(--text-light); text-decoration: underline; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header-inner { padding: 10px 15px; }
            .logo-area img { height: 50px; }
            .btn-back { font-size: 10px; padding: 6px 12px; }
            main { margin-top: 100px; padding: 0 15px 50px; }
            .project-hero { height: 280px; border-radius: 12px; }
            .project-info { padding: 30px 20px; border-radius: 12px; }
            .project-cta { padding: 35px 20px; border-radius: 12px; }
            .cta-title { font-size: 20px; }
        }
        @media (max-width: 375px) {
            .logo-area img { height: 40px; }
            .project-hero { height: 220px; }
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-inner">
        <a href="index.html" class="logo-area">
            <img src="logoheaderhq.png" alt="CEE Mimarlık" id="headerLogo">
            <span class="logo-text" id="logoSubText">MİMARLIK & YAPI SİSTEMLERİ</span>
        </a>
        <div class="header-right">
            <a href="projeler.html" class="btn-back" data-tr="← Projeler" data-en="← Projects" data-de="← Projekte" data-ru="← Проекты" data-ar="← المشاريع" data-fa="← پروژه‌ها" data-es="← Proyectos">← Projeler</a>
            <button class="theme-toggle" onclick="toggleDarkMode()" id="themeBtn" aria-label="Tema Değiştir">🌙</button>
        </div>
    </div>
</header>

<main id="mainContent">
    <div class="loading"><div class="loading-spinner"></div><p data-tr="Proje yükleniyor..." data-en="Loading project..." data-de="Projekt wird geladen..." data-ru="Загрузка проекта..." data-ar="جاري تحميل المشروع..." data-fa="در حال بارگذاری..." data-es="Cargando proyecto...">Proje yükleniyor...</p></div>
</main>

<footer class="site-footer">
    <p>© 2026 CEE Mimarlık. <span data-tr="Tüm hakları saklıdır." data-en="All rights reserved.">Tüm hakları saklıdır.</span> · <a href="gizlilik.html" data-tr="Gizlilik" data-en="Privacy">Gizlilik</a></p>
</footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const projectId = parseInt(urlParams.get('id'));

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('darkMode', isDark);
    document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
}

function renderProject(project) {
    const main = document.getElementById('mainContent');
    if (!project) {
        main.innerHTML = '<div class="not-found"><h2>Proje Bulunamadı</h2><p style="color:var(--secondary);margin-bottom:25px">Aradığınız proje mevcut değil veya kaldırılmış olabilir.</p><a href="projeler.html" class="cta-btn" style="display:inline-block;background:var(--primary);color:white;padding:12px 30px;border-radius:6px;text-decoration:none;font-size:11px;letter-spacing:2px;text-transform:uppercase">Projelere Dön</a></div>';
        return;
    }

    const images = project.images || (project.image ? [project.image] : []);
    const mainImg = images[0] || '';
    const description = project.description || 'Bu proje, modern mimarlık anlayışıyla tasarlanmış olup, estetik ve işlevselliği bir arada sunmaktadır. Proje tasarımından uygulama süreçlerine kadar tüm aşamalar titizlikle yönetilerek, mekânlara teknik açıdan sağlam, estetik ve işlevsel çözümler sunulmaktadır.';

    let html = '';

    // Hero image
    if (mainImg) {
        html += `<div class="project-hero"><img src="${mainImg}" alt="${project.title || 'Proje'}" id="heroImg"></div>`;
    }

    // Gallery (if multiple images)
    if (images.length > 1) {
        html += '<div class="project-gallery">';
        images.forEach((img, i) => {
            html += `<img src="${img}" alt="Fotoğraf ${i+1}" class="${i===0?'active':''}" onclick="document.getElementById('heroImg').src=this.src;document.querySelectorAll('.project-gallery img').forEach(g=>g.classList.remove('active'));this.classList.add('active')">`;
        });
        html += '</div>';
    }

    // Info card
    html += '<div class="project-info">';
    html += `<h1 class="project-title">${project.title || 'Proje Detayı'}</h1>`;
    html += '<div class="section-decoration"><span class="dot"></span></div>';

    // Tags
    const tags = [];
    if (project.category) tags.push(project.category);
    if (project.status) tags.push(project.status);
    if (tags.length > 0) {
        html += '<div class="project-tags">' + tags.map(t => `<span class="project-tag">${t}</span>`).join('') + '</div>';
    }

    // Meta grid
    const metaItems = [];
    if (project.location) metaItems.push({ label: '📍 Konum', value: project.location });
    if (project.area) metaItems.push({ label: '📐 Alan', value: project.area + ' m²' });
    if (project.date) metaItems.push({ label: '📅 Tarih', value: project.date });
    if (project.category) metaItems.push({ label: '📂 Kategori', value: project.category });

    if (metaItems.length > 0) {
        html += '<div class="project-meta-grid">';
        metaItems.forEach(m => {
            html += `<div class="meta-item"><div class="meta-label">${m.label}</div><div class="meta-value">${m.value}</div></div>`;
        });
        html += '</div>';
    }

    html += `<p class="project-description">${description}</p>`;
    html += '</div>';

    // CTA
    html += `<div class="project-cta">
        <h3 class="cta-title" data-tr="Benzer Bir Proje Mi Düşünüyorsunuz?" data-en="Thinking About a Similar Project?" data-de="Denken Sie an ein ähnliches Projekt?" data-ru="Думаете о подобном проекте?" data-ar="هل تفكر في مشروع مشابه؟" data-fa="آیا به پروژه مشابهی فکر می‌کنید؟" data-es="¿Pensando en un proyecto similar?">Benzer Bir Proje Mi Düşünüyorsunuz?</h3>
        <p class="cta-text" data-tr="Mimari projeleriniz için bizimle iletişime geçebilirsiniz." data-en="Contact us for your architectural projects." data-de="Kontaktieren Sie uns für Ihre Architekturprojekte." data-ru="Свяжитесь с нами для ваших архитектурных проектов." data-ar="تواصل معنا لمشاريعك المعمارية." data-fa="برای پروژه‌های معماری خود با ما تماس بگیرید." data-es="Contáctenos para sus proyectos arquitectónicos.">Mimari projeleriniz için bizimle iletişime geçebilirsiniz.</p>
        <a href="iletisim.html" class="cta-btn" data-tr="İletişime Geç" data-en="Contact Us" data-de="Kontakt" data-ru="Связаться" data-ar="اتصل بنا" data-fa="تماس بگیرید" data-es="Contacto">İletişime Geç</a>
    </div>`;

    main.innerHTML = html;
    document.title = (project.title || 'Proje') + ' - CEE Mimarlık';
}

document.addEventListener('DOMContentLoaded', function() {
    // Dark mode
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('themeBtn').textContent = '☀️';
    }
    // Logo from admin
    try {
        const ls = JSON.parse(localStorage.getItem('cee_logo_settings') || '{}');
        if (ls.image) document.getElementById('headerLogo').src = ls.image;
        if (ls.text) document.getElementById('logoSubText').textContent = ls.text;
    } catch(e) {}

    // Load project from correct localStorage key
    let projects = [];
    try { projects = JSON.parse(localStorage.getItem('cee_projects') || '[]'); } catch(e) {}

    const project = !isNaN(projectId) && projectId >= 0 && projectId < projects.length ? projects[projectId] : null;
    renderProject(project);
});
</script>
<script src="lang-switcher.js"></script>
<script src="cookie-consent.js"></script>
</body>
</html>
