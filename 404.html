<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png" href="logohq.png">
    <link rel="apple-touch-icon" href="appletouchicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | CEE Mimarlık</title>
    <meta name="description" content="Aradığınız sayfa bulunamadı.">
    <meta name="theme-color" content="#2c2c2c">
    <link rel="stylesheet" href="cross-browser-fix.css">
    <script src="polyfills.js" defer></script>
    <meta property="og:title" content="CEE Mimarlık - 404 - Sayfa Bulunamadı">
    <meta property="og:description" content="Aradığınız sayfa bulunamadı.">
    <meta property="og:image" content="https://www.ceemimarlik.com/ogimage.jpg">
    <meta property="og:url" content="https://www.ceemimarlik.com/404.html">
    <link rel="canonical" href="https://www.ceemimarlik.com/404.html">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #2c2c2c;
            --secondary: #666;
            --accent: #1a1a1a;
            --bg: #fafafa;
            --white: #ffffff;
            --border: #e0e0e0;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--primary);
            line-height: 1.7;
            overflow-x: hidden;
        }

        body.dark-mode {
            --primary: #e0e0e0;
            --secondary: #a0a0a0;
            --accent: #f0f0f0;
            --bg: #0f0f0f;
            --white: #1a1a1a;
            --border: #333;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 9999;
            background: #ffffff;
            padding: 12px 0;
            transition: all 0.4s ease;
            border-bottom: 1px solid var(--border);
        }
        body.dark-mode header { background: rgba(15, 15, 15, 0.95); }
        header.scrolled {
            padding: 8px 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.08);
        }
        body.dark-mode header.scrolled { background: rgba(15, 15, 15, 0.95); }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 5px;
            text-decoration: none;
            transition: all 0.4s ease;
        }
        .logo-wrapper img {
            height: 70px;
            width: auto;
            background: transparent !important;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        .logo-text {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #505050;
            text-align: center;
            margin-top: 2px;
        }
        body.dark-mode .logo-text { color: #c0c0c0; }

        nav { display: flex; gap: 40px; align-items: center; }
        nav a {
            color: var(--secondary);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
            position: relative;
            font-weight: 600;
            background: linear-gradient(180deg, #4a4a4a 0%, #5a5a5a 20%, #6a6a6a 40%, #5a5a5a 60%, #4a4a4a 80%, #3a3a3a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        body.dark-mode nav a {
            background: linear-gradient(180deg, #b0b0b0 0%, #c0c0c0 20%, #d0d0d0 40%, #c0c0c0 60%, #b0b0b0 80%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0;
            width: 0; height: 2px;
            background: linear-gradient(90deg, #3a3a3a, #6a6a6a, #3a3a3a);
            transition: width 0.3s;
        }
        nav a:hover::after, nav a.active::after { width: 100%; }

        .header-actions { display: flex; align-items: center; gap: 15px; }
        .dark-toggle {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(180deg, #e8e8e8 0%, #d0d0d0 50%, #b8b8b8 100%);
            border: 1px solid #999;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), inset 0 -1px 0 rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.15);
        }
        body.dark-mode .dark-toggle {
            background: linear-gradient(180deg, #505050, #353535, #252525);
            border-color: #555;
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--primary);
            padding: 8px;
        }

        /* PAGE HERO */
        .page-hero {
            padding: 180px 5% 100px;
            text-align: center;
            position: relative;
            background: linear-gradient(180deg, #f5f5f5 0%, #e8e8e8 50%, #f0f0f0 100%);
            overflow: hidden;
        }
        body.dark-mode .page-hero {
            background: linear-gradient(180deg, #151515 0%, #1a1a1a 50%, #0f0f0f 100%);
        }
        .page-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23000000' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }
        .page-hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }
        .section-label {
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 600;
            background: linear-gradient(180deg, #808080, #4a4a4a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        body.dark-mode .section-label {
            background: linear-gradient(180deg, #b0b0b0, #808080);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-hero h1 {
            font-size: 46px;
            font-weight: 400;
            letter-spacing: 6px;
            background: linear-gradient(180deg, #808080 0%, #505050 30%, #2a2a2a 70%, #1a1a1a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            line-height: 1.3;
            margin-bottom: 15px;
        }
        body.dark-mode .page-hero h1 {
            background: linear-gradient(180deg, #e0e0e0 0%, #a0a0a0 30%, #707070 70%, #505050 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .section-decoration::before,
        .section-decoration::after {
            content: '';
            width: 50px; height: 1px;
            background: #e0e0e0;
        }
        body.dark-mode .section-decoration::before,
        body.dark-mode .section-decoration::after { background: #333; }
        .section-decoration .dot {
            width: 12px; height: 12px;
            background: linear-gradient(180deg, #a0a0a0, #1a1a1a);
            transform: rotate(45deg);
        }
        body.dark-mode .section-decoration .dot {
            background: linear-gradient(180deg, #888, #444);
        }
        .page-hero p {
            font-size: 16px;
            color: var(--secondary);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* SECTION TITLES */
        .section-title {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #606060, #2a2a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            text-align: center;
        }
        body.dark-mode .section-title {
            background: linear-gradient(180deg, #c0c0c0, #707070);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* CARDS */
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 35px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 30px var(--shadow);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.1);
        }
        body.dark-mode .card { background: #1a1a1a; border-color: #2a2a2a; }

        /* CTA */
        .cta-section {
            text-align: center;
            padding: 80px 5%;
            background: linear-gradient(180deg, #f0f0f0, #e0e0e0, #f0f0f0);
        }
        body.dark-mode .cta-section {
            background: linear-gradient(180deg, #0f0f0f, #1a1a1a, #0f0f0f);
        }
        .cta-title {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #606060, #2a2a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        body.dark-mode .cta-title {
            background: linear-gradient(180deg, #c0c0c0, #707070);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .cta-text { font-size: 15px; color: var(--secondary); margin-bottom: 30px; }
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            background: linear-gradient(180deg, #d0d0d0, #808080, #2a2a2a);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 8px;
            border: 1px solid #1a1a1a;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), inset 0 -2px 0 rgba(0,0,0,0.2), 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .cta-btn:hover {
            transform: translateY(-4px);
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), 0 10px 30px rgba(0,0,0,0.3);
        }

        /* FOOTER */
        footer {
            background: #f8f9fa;
            padding: 25px 0;
            border-top: 1px solid #e5e7eb;
        }
        body.dark-mode footer { background: #0a0a0a; border-top-color: #222; }
        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5%;
            text-align: center;
        }
        .footer-copyright { font-size: 14px; color: #666; }
        body.dark-mode .footer-copyright { color: #888; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .page-hero { padding: 130px 5% 60px; }
            .page-hero h1 { font-size: 28px; letter-spacing: 3px; }
            .page-hero p { font-size: 14px; }
            .section-title { font-size: 24px; letter-spacing: 2px; }
        }
        @media (max-width: 375px) {
            .page-hero h1 { font-size: 22px; }
        }


        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: linear-gradient(180deg, #f5f5f5, #e8e8e8, #f0f0f0);
        }
        body.dark-mode .error-section {
            background: linear-gradient(180deg, #0f0f0f, #1a1a1a, #0f0f0f);
        }
        .error-code {
            font-size: 120px;
            font-weight: 300;
            letter-spacing: 10px;
            background: linear-gradient(180deg, #c0c0c0, #808080, #2a2a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .error-text {
            font-size: 15px;
            color: var(--secondary);
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        @media (max-width: 768px) {
            .error-code { font-size: 80px; }
            .error-title { font-size: 20px; }
        }

    </style>
</head>
<body>

<section class="error-section">
    <div>
        <div class="error-code">404</div>
        <div class="section-decoration" style="margin-bottom:20px;"><div class="dot"></div></div>
        <h1 class="error-title" data-tr="Sayfa Bulunamadı" data-en="Page Not Found">Sayfa Bulunamadı</h1>
        <p class="error-text" data-tr="Aradığınız sayfa taşınmış veya silinmiş olabilir." data-en="The page you're looking for may have been moved or deleted.">Aradığınız sayfa taşınmış veya silinmiş olabilir.</p>
        <a href="index.html" class="cta-btn" data-tr="Ana Sayfaya Dön" data-en="Return Home">← Ana Sayfaya Dön</a>
    </div>
</section>

<script>

function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    document.querySelector('.dark-toggle').textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
}
if (localStorage.getItem('darkMode') === 'true') {
    document.body.classList.add('dark-mode');
    document.querySelector('.dark-toggle').textContent = '☀️';
}

function toggleMenu() {
    const nav = document.getElementById('mainNav');
    const toggle = document.querySelector('.menu-toggle');
    nav.classList.toggle('active');
    if (nav.classList.contains('active')) {
        toggle.textContent = '✕';
        document.body.style.overflow = 'hidden';
    } else {
        toggle.textContent = '☰';
        document.body.style.overflow = '';
    }
}
document.querySelectorAll('#mainNav a').forEach(a => {
    a.addEventListener('click', () => {
        document.getElementById('mainNav').classList.remove('active');
        document.querySelector('.menu-toggle').textContent = '☰';
        document.body.style.overflow = '';
    });
});
window.addEventListener('scroll', () => {
    document.getElementById('siteHeader').classList.toggle('scrolled', window.scrollY > 50);
});

function loadSiteSettings() {
    const logo = localStorage.getItem('site_logo');
    if (logo) { const el = document.getElementById('siteLogo'); if (el) el.src = logo; }
    try {
        const ls = JSON.parse(localStorage.getItem('cee_logo_settings') || '{}');
        if (ls.text) { const el = document.getElementById('siteTitle'); if (el) el.textContent = ls.text; }
    } catch(e) {}
    try {
        const fs = JSON.parse(localStorage.getItem('cee_footer_settings') || '{}');
        if (fs.company) { const el = document.getElementById('footerCompany'); if (el) el.textContent = fs.company; }
    } catch(e) {}
}
document.addEventListener('DOMContentLoaded', loadSiteSettings);


</script>
<script src="lang-switcher.js"></script>
<script src="cookie-consent.js"></script>
</body>
</html>
