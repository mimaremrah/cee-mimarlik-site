<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="icon" type="image/png" href="logohq.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Giriş | CEE Mimarlık</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #f5f5f5 0%, #e0e0e0 50%, #d0d0d0 100%);
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 20px;
            padding: 45px 35px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            border: 1px solid #e0e0e0;
            text-align: center;
        }
        .login-logo { margin-bottom: 30px; }
        .login-logo img { height: 80px; width: auto; margin: 0 auto; }
        .login-logo-fallback {
            width: 70px; height: 70px;
            background: linear-gradient(180deg, #d0d0d0, #808080, #2a2a2a);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            margin-bottom: 15px;
            border: 1px solid #1a1a1a;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3);
        }
        .login-title {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #606060, #2a2a2a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
        }
        .login-sub { font-size: 13px; color: #888; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-label { font-size: 11px; color: #888; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            color: #333;
            transition: all 0.3s;
            font-family: inherit;
        }
        .form-input:focus { outline: none; border-color: #808080; box-shadow: 0 0 0 3px rgba(128,128,128,0.1); }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, #d0d0d0, #808080, #2a2a2a);
            color: white;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.3), 0 4px 15px rgba(0,0,0,0.2);
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        .login-error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
        .back-link { display: block; margin-top: 20px; color: #888; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #333; }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-logo">
            <div class="login-logo-fallback">🏛️</div>
            <h1 class="login-title">Yönetim Paneli</h1>
            <p class="login-sub">CEE Mimarlık Admin</p>
        </div>
        <div class="form-group">
            <label class="form-label">Kullanıcı Adı</label>
            <input type="text" class="form-input" id="username" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
            <label class="form-label">Şifre</label>
            <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <button class="login-btn" onclick="doLogin()">🔐 Giriş Yap</button>
        <p class="login-error" id="loginError">Hatalı kullanıcı adı veya şifre!</p>
        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
    </div>
    <script>
        document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
        
        async function sha256(text) {
            const data = new TextEncoder().encode(text);
            const hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        let attempts = 0, lockUntil = 0;
        
        async function doLogin() {
            const now = Date.now();
            if (now < lockUntil) {
                document.getElementById('loginError').textContent = `Çok fazla deneme! ${Math.ceil((lockUntil - now) / 1000)} saniye bekleyin.`;
                document.getElementById('loginError').style.display = 'block';
                return;
            }
            
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            let cred = { username: 'admin', password: 'admin123' };
            try {
                const saved = localStorage.getItem('cee_credentials_v2') || localStorage.getItem('cee_credentials');
                if (saved) cred = JSON.parse(saved);
            } catch(e) {}
            
            let valid = false;
            if (cred.passwordHash) {
                valid = (u === cred.username && await sha256(p) === cred.passwordHash);
            } else {
                valid = (u === cred.username && p === cred.password);
            }
            
            if (valid) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminLoginTime', Date.now().toString());
                window.location.href = 'admin.html';
            } else {
                attempts++;
                if (attempts >= 5) { lockUntil = Date.now() + 30000; attempts = 0; }
                document.getElementById('loginError').style.display = 'block';
            }
        }
    </script>
</body>
</html>
